name: offline-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: runtime/requirements.lock
      - name: Complete sockets-disabled test suite
        run: >-
          PYTHONDONTWRITEBYTECODE=1 uv run --no-project
          --with pytest --with pytest-asyncio --with pytest-socket
          --with-requirements runtime/requirements.lock
          python -m pytest -q -p no:cacheprovider --disable-socket --allow-unix-socket
      - name: Packaging gates
        run: >-
          PYTHONDONTWRITEBYTECODE=1 uv run --no-project
          --with pytest --with pytest-asyncio --with pytest-socket
          --with-requirements runtime/requirements.lock
          python -m pytest -q -p no:cacheprovider --disable-socket --allow-unix-socket
          tests/test_packaging.py tests/test_installer.py tests/test_active_residuals.py
      - name: Compile source
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python3 -m compileall -q
          runtime media-missher openclaw-media-missher tools tests
      - name: Check offline entrypoints
        run: |
          python3 runtime/scripts/scrape_all.py --help >/dev/null
          python3 runtime/scripts/scrape_bilibili.py --help >/dev/null
          python3 runtime/scripts/scrape_xhs.py --help >/dev/null
          python3 runtime/scripts/scrape_douyin.py --help >/dev/null
          python3 runtime/scripts/scrape_weibo.py --help >/dev/null
      - name: Scan active residuals
        run: python3 tools/scan_active_residuals.py --root .

  harness-bundle:
    runs-on: macos-15
    defaults:
      run:
        working-directory: harness-plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
      - uses: pnpm/action-setup@v6
        with:
          version: "11.1.3"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build
      - run: pnpm run verify:package -- dist/dsh-media-missher-0.1.0.tgz
      - run: pnpm run pack:setup
      - run: pnpm run verify:setup -- dist/Media-Missher-Harness-Setup-v15.2.1.zip
      - name: Require reproducible tracked Setup assets
        working-directory: .
        run: >-
          git diff --exit-code --
          harness-plugin/dist/Media-Missher-Harness-Setup-v15.2.1.zip
          harness-plugin/dist/SETUP-SHA256.txt
