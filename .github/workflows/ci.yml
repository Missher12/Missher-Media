name: offline-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: runtime/requirements.lock
      - name: Complete sockets-disabled test suite
        run: >-
          PYTHONDONTWRITEBYTECODE=1 uv run --no-project
          --with pytest --with pytest-asyncio --with pytest-socket
          --with-requirements runtime/requirements.lock
          python -m pytest -q -p no:cacheprovider --disable-socket --allow-unix-socket
      - name: Packaging gates
        run: >-
          PYTHONDONTWRITEBYTECODE=1 uv run --no-project
          --with pytest --with pytest-asyncio --with pytest-socket
          --with-requirements runtime/requirements.lock
          python -m pytest -q -p no:cacheprovider --disable-socket --allow-unix-socket
          tests/test_packaging.py tests/test_installer.py tests/test_active_residuals.py
      - name: Compile source
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python3 -m compileall -q
          runtime media-missher openclaw-media-missher tools tests
      - name: Check offline entrypoints
        run: |
          python3 runtime/scripts/scrape_all.py --help >/dev/null
          python3 runtime/scripts/scrape_bilibili.py --help >/dev/null
          python3 runtime/scripts/scrape_xhs.py --help >/dev/null
          python3 runtime/scripts/scrape_douyin.py --help >/dev/null
          python3 runtime/scripts/scrape_weibo.py --help >/dev/null
      - name: Scan active residuals
        run: python3 tools/scan_active_residuals.py --root .

  harness-bundle:
    runs-on: macos-15
    defaults:
      run:
        working-directory: harness-plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
      - uses: pnpm/action-setup@v6
        with:
          version: "11.1.3"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm run pack:bundle
      - run: pnpm run verify:package -- --write-checksum dist/dsh-media-missher-17.0.0.tgz

  agent-entry:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v6
        with:
          version: '11.1.3'
      - run: pnpm --dir harness-plugin install --frozen-lockfile
      - run: npm install --prefix agent-plugin --ignore-scripts --no-audit --no-fund --no-package-lock
      - run: node agent-plugin/scripts/build.mjs
      - run: node --test agent-plugin/tests/*.test.mjs
      - run: node agent-plugin/scripts/build-setup.mjs
      - name: Actual standalone install with isolated HOME and synthetic roster
        run: node agent-plugin/scripts/native-smoke.mjs
      - name: Complete private distribution and nested checksum gates
        run: node tools/build_distribution.mjs

  windows-entry-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell entry without enabling or starting WSL
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          Write-Output 'PowerShell syntax passed. This does not verify Windows/WSL installation or browser operation.'
